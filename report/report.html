<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리포트 생성 중...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            background: linear-gradient(180deg, #f7fbff, #e8f2ff);
        }

        .box {
            text-align: center;
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="title">📊 리포트 생성 중</div>
        <div class="desc">잠시만 기다려주세요...</div>
    </div>

    <script>
    async function openScoreReportPage() {
      try {
        const userStr = localStorage.getItem("loginUser");

        if (!userStr) {
          alert("로그인이 필요합니다.");
          return;
        }

        const user = JSON.parse(userStr);

        if (!user || !user.id) {
          alert("사용자 정보가 없습니다.");
          return;
        }

        const response = await fetch("/api/score_report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json; charset=UTF-8"
          },
          body: JSON.stringify({
            user_id: user.id
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok || !data.reportUrl) {
          console.error(data);
          alert("리포트 생성 실패");
          return;
        }

        // 👉 결과 페이지로 이동
        window.location.href = data.reportUrl;

      } catch (error) {
        console.error(error);
        alert("리포트 생성 중 오류");
      }
    }

    // 🔥 페이지 로드되면 자동 실행
    window.addEventListener("load", function () {
      openScoreReportPage();
    });
    </script>
</body>
</html>
